name: Lint
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jq:
    name: JQ
    runs-on: truenas-default-storage-8g
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Validate
        run: jq --raw-output . appdaemon blacklist critical integration netdaemon plugin python_script removed template theme

  jsonschema:
    name: JSON schema
    runs-on: truenas-default-storage-8g
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Critical
        run: tools/ci/run-schema-validator.sh critical tools/jsonschema/critical.schema.json

      - name: Repositories
        run: tools/ci/run-schema-validator.sh 'appdaemon|blacklist|integration|netdaemon|plugin|python_script|template|theme' tools/jsonschema/repositories.schema.json

      - name: Removed
        run: tools/ci/run-schema-validator.sh removed tools/jsonschema/removed.schema.json

  sorted:
    name: Sorted
    runs-on: truenas-default-storage-8g
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Check lists
        run: python3 scripts/is_sorted.py
