name: Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - unlabeled
    branches:
      - master
    paths:
      - appdaemon
      - integration
      - plugin
      - python_script
      - template
      - theme

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  preflight:
    runs-on: truenas-default-storage-8g
    name: Preflight
    outputs:
      repository: ${{ steps.repository.outputs.repository }}
      category: ${{ steps.category.outputs.category }}
      removal: ${{ steps.removal.outputs.removal }}
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Clone origin
        run: git clone --depth 1 https://github.com/hacs/default /tmp/repositories/default

      - name: Set repository
        id: repository
        run: echo "repository=$(python3 -m scripts.changed.repo)" >> $GITHUB_OUTPUT

      - name: Set category
        id: category
        run: echo "category=$(python3 -m scripts.changed.category)" >> $GITHUB_OUTPUT

      - name: Check removal
        id: removal
        run: |
          if [ "${{ steps.repository.outputs.repository }}" == "Bad data []" ]; then
            echo "removal=true" >> $GITHUB_OUTPUT
          fi

  owner:
    runs-on: truenas-default-storage-8g
    name: Owner
    needs: preflight
    if: needs.preflight.outputs.removal != 'true'
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.owner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  editable:
    runs-on: truenas-default-storage-8g
    name: Editable PR
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.edits

  releases:
    runs-on: truenas-default-storage-8g
    name: Releases
    needs: preflight
    if: needs.preflight.outputs.removal != 'true'
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  removed:
    runs-on: truenas-default-storage-8g
    name: Removed repository
    needs: preflight
    if: needs.preflight.outputs.removal != 'true'
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.removed
        env:
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  existing:
    runs-on: truenas-default-storage-8g
    name: Existing repository
    needs: preflight
    if: needs.preflight.outputs.removal != 'true'
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.existing
        env:
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  hassfest:
    runs-on: truenas-default-storage-8g
    name: Hassfest
    needs: preflight
    if: needs.preflight.outputs.category == 'integration' && needs.preflight.outputs.removal != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Check out trusted validator adapter
        uses: actions/checkout@v6.0.2
        with:
          path: .ci/trusted-adapter
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Prepare disk dependency cache
        run: ci-cache downloads

      - name: Set up Python for Hassfest
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.5"

      - name: Register Hassfest problem matcher
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.ci/trusted-adapter/.github/scripts/hassfest-problem-matcher.json"

      - name: Clone new addition
        run: |
          git clone --depth 1 "https://github.com/${{needs.preflight.outputs.repository}}" /tmp/repositories/addition

      - name: Run hassfest
        run: |
          integration=$(python3 -m scripts.helpers.integration_path)
          bash .ci/trusted-adapter/.github/scripts/ha-validators.sh hassfest --integration-path "$integration"

  hacs:
    runs-on: truenas-default-storage-8g
    name: HACS action
    needs: preflight
    if: needs.preflight.outputs.removal != 'true'
    env:
      BUILDKIT_TLS_CA_CERT: /run/buildkit/tls/ca.pem
      BUILDKIT_TLS_CLIENT_CERT: /run/buildkit/tls/client.pem
      BUILDKIT_TLS_CLIENT_KEY: /run/buildkit/tls/client.key
    steps:
      - name: Check out trusted CI adapter
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python for HACS image resolution
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.5"

      - name: Prepare empty HACS context
        run: |
          mkdir -p "$RUNNER_TEMP/hacs-context"
          cp .github/scripts/hacs-remote-validator.Dockerfile "$RUNNER_TEMP/hacs-context/Dockerfile"

      - name: Set up isolated BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=${{ env.BUILDKIT_TLS_CA_CERT }}
            cert=${{ env.BUILDKIT_TLS_CLIENT_CERT }}
            key=${{ env.BUILDKIT_TLS_CLIENT_KEY }}

      - name: Resolve current HACS validator image
        id: hacs-image
        run: python3 .github/scripts/resolve-hacs-image.py

      - name: Run HACS validator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          HACS_GITHUB_TOKEN: ${{ github.token }}
        with:
          build-args: |
            HACS_ACTION_IMAGE=${{ steps.hacs-image.outputs.image }}
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF=${{ github.ref }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_EVENT_NAME=${{ github.event_name }}
            INPUT_CATEGORY=${{ needs.preflight.outputs.category }}
            INPUT_REPOSITORY=${{ needs.preflight.outputs.repository }}
            INPUT_COMMENT=true
          context: ${{ runner.temp }}/hacs-context
          file: Dockerfile
          no-cache: true
          outputs: type=local,dest=${{ runner.temp }}/hacs-result
          platforms: linux/amd64
          secret-envs: hacs-token=HACS_GITHUB_TOKEN
          secret-files: github-event=${{ github.event_path }}
          target: result

      - name: Require passing HACS result
        run: |
          cat "$RUNNER_TEMP/hacs-result/validator.log"
          test "$(cat "$RUNNER_TEMP/hacs-result/exit-code")" = 0

      - name: Remove temporary HACS files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/hacs-context" "$RUNNER_TEMP/hacs-result"
